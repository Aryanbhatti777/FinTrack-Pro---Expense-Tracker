<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinTrack Pro</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="auth.js"></script>
    <script>
        authUser(false)
    </script>
</head>

<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Login to FinTrack Pro</p>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text"  required="" name="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required="" name="password">
            </div>
            <button type="submit" >Login</button>
        </form>
        <p style="margin-top: 10px; font-size: 18px;">Don't have an account? <a href="register.html">Register here</a></p>
    </div>

    <script src="auth.js"></script>
    <script>
        const form = document.querySelector("#loginForm");

        form.addEventListener("submit", (e) => {
            e.preventDefault()

            const username = form.username.value;
            const password = form.password.value;

            const attempt = Login(username, password)

            if(attempt.success){
                window.location.replace("register.html");
            }else{
                alert(attempt.message)
            }
        })
    </script>
</body>

</html>
