<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FinTrack Pro</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-card">
        <h2>Create Account</h2>
        <p>Join FinTrack Pro</p>
        <form id="registerForm">
            <div class="form-group">
                <label>Choose a Username</label>
                <input type="text"  required name="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password"  required name="password">
            </div>
            <button type="submit" id="register-btn">Register</button>
        </form>
        <p style="margin-top: 10px; font-size: 18px;">Already have an account? <a href="login.html">Login here</a></p>
    </div>

    <script src="auth.js"></script>

    <script>

        const form = document.querySelector("#registerForm")
        form.addEventListener("submit", (e) => {
            e.preventDefault()
            const username = form.username.value
            const password = form.password.value
            const attempt = Register(username, password)

            if(attempt.success){
                form.username.value = ""
                form.password.value = ""
                alert(attempt.message)
                window.location.href = "login.html"
            }
        })
    </script>
</body>

</html>
